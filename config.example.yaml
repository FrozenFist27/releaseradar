# ReleaseRadar configuration (copy to config.yaml and edit).
poll_interval_s: 30
jitter_s: 3
fail_alert_after_s: 300
heartbeat_interval_s: 21600

sources:
  github_releases:
    include_prereleases: false
    targets:
      # Latency harness (sandbox repo). Replace with your own.
      - astral-sh/uv
      - pydantic/pydantic
      - fastapi/fastapi

filter:
  enabled: false
  provider: anthropic       # anthropic | none
  model: claude-haiku-5-5
  criteria: "Alert only for releases with security fixes, breaking changes, or new major features."

notify:
  alerts: discord           # discord
  health: discord
